
spring.application.name=PaymentProcessing

spring.datasource.url=jdbc:mysql://localhost:3306/payment_processing
spring.datasource.username=root
spring.datasource.password=root


logging.level.org.springframework.jdbc.core=DEBUG

server.port=8091

twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}
twilio.default-country-code=${TWILIO_DEFAULT_COUNTRY_CODE:+91}

jwt.secret=${JWT_SECRET:dev-only-change-this-secret-key-before-deploying-32bytes+}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}